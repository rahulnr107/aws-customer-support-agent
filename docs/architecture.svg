<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1090" viewBox="0 0 1440 1090" role="img" aria-labelledby="title description">
<title id="title">AWS Customer Support Agent - Deployed Architecture</title>
<desc id="description">Invited viewers access a private Streamlit app. The Streamlit server signs HTTPS requests to AgentCore using an invoke-only IAM identity. Inside AgentCore Runtime, a Strands agent runs Python tools, workflow controls and temporary snapshots. Its execution role authorizes separate model calls to Nova Pro on Amazon Bedrock. Logs and traces are sent to CloudWatch. Streamlit display history is separate from temporary agent snapshots.</desc>
